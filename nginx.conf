server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|js|css|png|jpg|jpeg|gif|svg|ico|pdf|woff|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types
        text/css
        application/javascript
        application/wasm
        application/json
        image/svg+xml;
}
